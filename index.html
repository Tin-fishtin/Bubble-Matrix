<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bubble Matrix — Display</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: #0a0a0a;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #000;
    touch-action: none;
  }

  /* One-time "tap to start" overlay. iOS requires camera access to be
     kicked off from a real tap on THIS device — it can't be triggered
     remotely from the control laptop. Shown until camera is live. */
  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
    padding: 24px;
  }
  #startOverlay.hidden { display: none; }
  #startBtn {
    background: #1c1c1c;
    border: 1px solid #ffb84d;
    color: #ffb84d;
    padding: 16px 28px;
    border-radius: 8px;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  #startStatus { color: #8a8a85; font-size: 12px; max-width: 320px; line-height: 1.5; }

  /* Tiny always-present recall zone: tap 5x to bring the start overlay
     back if the camera ever needs to be re-granted after a reload */
  #recallZone {
    position: fixed;
    top: 0; left: 0;
    width: 70px; height: 70px;
    z-index: 40;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="recallZone"></div>

<div id="startOverlay">
  <button id="startBtn">Tap to start camera</button>
  <div id="startStatus">This only needs to be tapped once per reload — after that the display runs on its own.</div>
</div>

<video id="camVideo" autoplay playsinline muted style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden; top:0; left:0;"></video>

<!-- No Firebase SDK here on purpose — Firebase's JS library requires modern
     browser features and isn't guaranteed to run on iOS 12 (iPhone 6's
     ceiling). We talk to the Realtime Database's plain REST API instead,
     using nothing but fetch(), which iOS 12 supports fine. -->
<script>
// =========================================================================
// PASTE YOUR DATABASE URL HERE — the "databaseURL" field from your Firebase
// config, e.g. "https://your-project-default-rtdb.firebaseio.com"
// (no trailing slash)
// =========================================================================
const FIREBASE_DB_URL = "https://bubble-matrix-default-rtdb.firebaseio.com/";


const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const camVideo = document.getElementById('camVideo');

// ---------- Defaults (used until/unless Firebase has something) ----------
let displayMode = 'camera';
let diameter = 70, spacingX = 80, spacingY = 72, rowStagger = 0.5, offsetX = 0, offsetY = 0;
let orientationMode = 'flip'; // 'flip' | 'random'
let mirrorCols = true, mirrorRows = false, camFacing = 'environment';
let orientationSeed = 0;
let fisheyeStrength = 0; // 0 = off, up to 1 = strong bulge
let colorMode = 'solid', colorA = '#ffb84d', colorB = '#4da3ff', pulseSpeed = 60;
let glowEnabled = false, glowMode = 'single', glowColor = '#ffb84d', glowStrength = 18, glowIntensity = 0.4, rainbowSeed = 0;
let overlayOn = true, bgMode = 'solid', bgColorA = '#000000', bgColorB = '#1a1a2e', bgSpeed = 60;
let renderScale = 1.5, maxFps = 30;
let t = 0, lastFrameTime = performance.now();
let camActive = false, camStream = null;

function applySettings(s) {
  if (!s) return;
  if (s.displayMode) displayMode = s.displayMode;
  if (typeof s.diameter === 'number') diameter = s.diameter;
  if (typeof s.spacingX === 'number') spacingX = s.spacingX;
  if (typeof s.spacingY === 'number') spacingY = s.spacingY;
  if (typeof s.rowStagger === 'number') rowStagger = s.rowStagger;
  if (typeof s.offsetX === 'number') offsetX = s.offsetX;
  if (typeof s.offsetY === 'number') offsetY = s.offsetY;
  if (s.orientationMode) orientationMode = s.orientationMode;
  if (typeof s.mirrorCols === 'boolean') mirrorCols = s.mirrorCols;
  if (typeof s.mirrorRows === 'boolean') mirrorRows = s.mirrorRows;
  if (typeof s.orientationSeed === 'number') orientationSeed = s.orientationSeed;
  if (typeof s.fisheyeStrength === 'number') fisheyeStrength = s.fisheyeStrength;
  if (s.colorMode) colorMode = s.colorMode;
  if (s.colorA) colorA = s.colorA;
  if (s.colorB) colorB = s.colorB;
  if (typeof s.pulseSpeed === 'number') pulseSpeed = s.pulseSpeed;
  if (typeof s.glowEnabled === 'boolean') glowEnabled = s.glowEnabled;
  if (s.glowMode) glowMode = s.glowMode;
  if (s.glowColor) glowColor = s.glowColor;
  if (typeof s.glowStrength === 'number') glowStrength = s.glowStrength;
  if (typeof s.glowIntensity === 'number') glowIntensity = s.glowIntensity;
  if (typeof s.rainbowSeed === 'number') rainbowSeed = s.rainbowSeed;
  if (typeof s.overlayOn === 'boolean') overlayOn = s.overlayOn;
  if (s.bgMode) bgMode = s.bgMode;
  if (s.bgColorA) bgColorA = s.bgColorA;
  if (s.bgColorB) bgColorB = s.bgColorB;
  if (typeof s.bgSpeed === 'number') bgSpeed = s.bgSpeed;
  if (typeof s.maxFps === 'number') maxFps = s.maxFps;

  if (typeof s.renderScale === 'number' && s.renderScale !== renderScale) {
    renderScale = s.renderScale;
    resize();
  }

  // camFacing changing means we need to restart the stream with the new
  // facing mode — but only if the camera is already running.
  if (s.camFacing && s.camFacing !== camFacing) {
    camFacing = s.camFacing;
    if (camActive) startCamera();
  }
}

async function pollSettings() {
  try {
    const res = await fetch(FIREBASE_DB_URL + '/bubbleMatrix/settings.json');
    const s = await res.json();
    applySettings(s);
  } catch (err) {
    // network hiccup — just keep whatever settings we already have and try again next tick
  }
}
pollSettings();
setInterval(pollSettings, 800);

// ---------- Camera ----------
async function startCamera() {
  try {
    if (camStream) camStream.getTracks().forEach(tr => tr.stop());
    // Cap the requested resolution — bubbles only ever show a small cropped
    // circle of this, so decoding a huge frame just burns CPU for nothing.
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: camFacing, width: { ideal: 720 } },
      audio: false
    });
    camVideo.srcObject = camStream;
    await camVideo.play();
    camActive = true;
    document.getElementById('startOverlay').classList.add('hidden');
    reportStatus();
  } catch (err) {
    camActive = false;
    document.getElementById('startStatus').textContent =
      'Could not access camera (' + err.message + '). Make sure this page was opened via its https:// URL directly in Safari.';
    reportStatus();
  }
}
document.getElementById('startBtn').addEventListener('click', startCamera);

function reportStatus() {
  fetch(FIREBASE_DB_URL + '/bubbleMatrix/status.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      camActive,
      cssWidth: window.innerWidth,
      cssHeight: window.innerHeight,
      dpr: window.devicePixelRatio || 1,
      lastSeen: Date.now()
    })
  }).catch(() => { /* network hiccup — ignore, next heartbeat will retry */ });
}
setInterval(reportStatus, 15000); // heartbeat so the control page can show "last seen"

// Recall zone: tap 5x top-left to bring the start overlay back
let tapCount = 0, tapTimer = null;
document.getElementById('recallZone').addEventListener('click', () => {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 3000);
  if (tapCount >= 5) {
    tapCount = 0;
    document.getElementById('startOverlay').classList.remove('hidden');
  }
});

// ---------- Sizing ----------
function resize() {
  canvas.width = Math.round(window.innerWidth * renderScale);
  canvas.height = Math.round(window.innerHeight * renderScale);
  reportStatus();
}
window.addEventListener('resize', resize);

// ---------- Deterministic per-cell randomness ----------
function hash2(a, b, seed) {
  const s = (seed === undefined) ? rainbowSeed : seed;
  const n = Math.sin(a * 127.1 + b * 311.7 + s * 0.017) * 43758.5453;
  return n - Math.floor(n);
}

function hexOrNamedToRgb(color) {
  if (color.charAt(0) === '#') {
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    return `${r},${g},${b}`;
  }
  return '255,184,77';
}

// ---------- Grid computation ----------
function computeGrid(cssW, cssH) {
  const cells = [];
  const pad = diameter;
  const rowStart = Math.floor((-pad - offsetY) / spacingY) - 1;
  const rowEnd = Math.ceil((cssH + pad - offsetY) / spacingY) + 1;
  for (let row = rowStart; row <= rowEnd; row++) {
    const stagger = (((row % 2) + 2) % 2 === 1) ? rowStagger * spacingX : 0;
    const colStart = Math.floor((-pad - offsetX - stagger) / spacingX) - 1;
    const colEnd = Math.ceil((cssW + pad - offsetX - stagger) / spacingX) + 1;
    for (let col = colStart; col <= colEnd; col++) {
      const cx = col * spacingX + stagger + offsetX;
      const cy = row * spacingY + offsetY;
      if (cx > -diameter && cx < cssW + diameter && cy > -diameter && cy < cssH + diameter) {
        cells.push({ col, row, cx, cy });
      }
    }
  }
  return cells;
}

function lerpRgb(rgbA, rgbB, mixT) {
  const a = rgbA.split(',').map(Number);
  const b = rgbB.split(',').map(Number);
  const r = Math.round(a[0] + (b[0] - a[0]) * mixT);
  const g = Math.round(a[1] + (b[1] - a[1]) * mixT);
  const bl = Math.round(a[2] + (b[2] - a[2]) * mixT);
  return `rgb(${r},${g},${bl})`;
}

function drawBackground(cssW, cssH) {
  if (bgMode === 'solid') {
    ctx.fillStyle = bgColorA;
    ctx.fillRect(0, 0, cssW, cssH);
    return;
  }
  const speedFactor = bgSpeed / 60;
  const rgbA = hexOrNamedToRgb(bgColorA);
  const rgbB = hexOrNamedToRgb(bgColorB);
  if (bgMode === 'pulse') {
    const mixT = 0.5 + 0.5 * Math.sin(t * speedFactor);
    ctx.fillStyle = lerpRgb(rgbA, rgbB, mixT);
    ctx.fillRect(0, 0, cssW, cssH);
    return;
  }
  const blockSize = 48;
  const cols = Math.ceil(cssW / blockSize) + 1;
  const rows = Math.ceil(cssH / blockSize) + 1;
  for (let by = 0; by < rows; by++) {
    for (let bx = 0; bx < cols; bx++) {
      const px = bx * blockSize, py = by * blockSize;
      let mixT;
      if (bgMode === 'wave') {
        mixT = 0.5 + 0.5 * Math.sin((px / cssW) * 6 - t * speedFactor * 1.2);
      } else {
        const dx = (px / cssW) - 0.5, dy = (py / cssH) - 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        mixT = 0.5 + 0.5 * Math.sin(dist * 16 - t * speedFactor * 2.4);
      }
      ctx.fillStyle = lerpRgb(rgbA, rgbB, mixT);
      ctx.fillRect(px, py, blockSize + 1, blockSize + 1);
    }
  }
}

// =========================================================================
// SPRITE CACHE — the single biggest performance change from before.
// Previously every bubble created a brand-new canvas gradient every single
// frame for its vignette and its glow. Gradient creation is expensive, and
// multiplying that by 100+ bubbles at 60fps was the main source of lag.
// Instead we pre-render each effect ONCE into a small offscreen bitmap
// ("sprite") whenever the relevant settings change, and every frame just
// stamps that bitmap in place with drawImage — which is cheap.
// =========================================================================
let vignetteSprite = null, vignetteSpriteKey = '';
function getVignetteSprite(radius) {
  const key = radius.toFixed(1);
  if (vignetteSprite && vignetteSpriteKey === key) return vignetteSprite;
  const size = Math.ceil(radius * 2) + 2;
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const c = size / 2;
  const grad = octx.createRadialGradient(c, c, radius * 0.3, c, c, radius);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.35)');
  octx.beginPath();
  octx.arc(c, c, radius, 0, Math.PI * 2);
  octx.fillStyle = grad;
  octx.fill();
  vignetteSprite = { canvas: off, size };
  vignetteSpriteKey = key;
  return vignetteSprite;
}

// Glow sprites: one for 'single' mode, up to 24 (quantized by hue) for
// 'rainbow' mode. Regenerated only when reach/intensity/radius/color change.
let glowSpriteCache = { key: '', single: null, rainbow: null };
const GLOW_HUE_BUCKETS = 24;
function renderGlowSprite(rgbString, outerR, radius, intensity) {
  const size = Math.ceil(outerR * 2) + 2;
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const c = size / 2;
  const grad = octx.createRadialGradient(c, c, radius * 0.92, c, c, outerR);
  grad.addColorStop(0, `rgba(${rgbString},0)`);
  grad.addColorStop(0.45, `rgba(${rgbString},${intensity})`);
  grad.addColorStop(1, `rgba(${rgbString},0)`);
  octx.beginPath();
  octx.arc(c, c, outerR, 0, Math.PI * 2);
  octx.fillStyle = grad;
  octx.fill();
  return { canvas: off, size };
}
function getGlowSprites(radius) {
  const outerR = radius + Math.max(2, glowStrength);
  const key = [radius.toFixed(1), outerR.toFixed(1), glowIntensity.toFixed(2), glowMode, glowColor].join('|');
  if (glowSpriteCache.key === key) return glowSpriteCache;
  if (glowMode === 'rainbow') {
    const sprites = [];
    for (let i = 0; i < GLOW_HUE_BUCKETS; i++) {
      const hue = Math.round((i / GLOW_HUE_BUCKETS) * 360);
      sprites.push(renderGlowSprite(hslToRgbString(hue, 90, 62), outerR, radius, glowIntensity));
    }
    glowSpriteCache = { key, single: null, rainbow: sprites, outerR };
  } else {
    const single = renderGlowSprite(hexOrNamedToRgb(glowColor), outerR, radius, glowIntensity);
    glowSpriteCache = { key, single, rainbow: null, outerR };
  }
  return glowSpriteCache;
}
function hslToRgbString(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return `${Math.round(f(0) * 255)},${Math.round(f(8) * 255)},${Math.round(f(4) * 255)}`;
}

// ---------- Drawing ----------
function drawCameraCell(cx, cy, col, row, radius, srcOffX, srcOffY, srcSize) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(cx, cy);

  const baseFlip = (camFacing === 'user') ? -1 : 1;

  if (orientationMode === 'random') {
    const angle = hash2(col * 7 + 3, row * 11 + 5, orientationSeed) * Math.PI * 2;
    ctx.rotate(angle);
    ctx.scale(baseFlip, 1);
  } else {
    const colFlip = (mirrorCols && (((col % 2) + 2) % 2 === 1)) ? -1 : 1;
    const rowFlip = (mirrorRows && (((row % 2) + 2) % 2 === 1)) ? -1 : 1;
    ctx.scale(baseFlip * colFlip, rowFlip);
  }

  if (fisheyeStrength <= 0.001) {
    // Fast path — one draw call, used whenever fisheye is off (the default).
    ctx.drawImage(camVideo, srcOffX, srcOffY, srcSize, srcSize, -radius, -radius, radius * 2, radius * 2);
  } else {
    // Fisheye path — approximate a lens bulge with a handful of concentric
    // rings, each uniformly rescaled a little differently. This is a cheap
    // stand-in for true per-pixel warping, which would be far too slow to
    // run for 100+ live bubbles on this hardware. Ring count scales with
    // bubble size so small bubbles (the common case) stay cheap.
    const ringCount = Math.max(3, Math.min(8, Math.round(radius / 9)));
    const p = 1 + fisheyeStrength * 3.5; // distortion curve exponent
    for (let i = 0; i < ringCount; i++) {
      const destTOuter = (i + 1) / ringCount;
      const destTInner = i / ringCount;
      const destROuter = destTOuter * radius;
      const destRInner = destTInner * radius;
      const srcTOuter = Math.pow(destTOuter, p);
      const srcROuter = srcTOuter * (srcSize / 2);
      const scale = destROuter / srcROuter;

      ctx.save();
      const ringPath = new Path2D();
      ringPath.arc(0, 0, destROuter, 0, Math.PI * 2);
      if (destRInner > 0.5) {
        ringPath.moveTo(destRInner, 0);
        ringPath.arc(0, 0, destRInner, 0, Math.PI * 2, true);
      }
      ctx.clip(ringPath, 'evenodd');
      ctx.scale(scale, scale);
      ctx.drawImage(camVideo, srcOffX, srcOffY, srcSize, srcSize, -srcSize / 2, -srcSize / 2, srcSize, srcSize);
      ctx.restore();
    }
  }

  ctx.restore(); // undo clip/translate/rotate/scale

  const vign = getVignetteSprite(radius);
  ctx.drawImage(vign.canvas, cx - vign.size / 2, cy - vign.size / 2);
}

function render() {
  const dpr = renderScale;
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;

  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  drawBackground(cssW, cssH);

  const radius = diameter / 2;
  const cells = computeGrid(cssW, cssH);

  const vw = camVideo.videoWidth;
  const vh = camVideo.videoHeight;
  const camReady = displayMode === 'camera' && camActive && vw > 0 && vh > 0;
  let srcSize, srcOffX, srcOffY;
  if (camReady) {
    srcSize = Math.min(vw, vh);
    srcOffX = (vw - srcSize) / 2;
    srcOffY = (vh - srcSize) / 2;
  }

  // Batch the plain thin outline into ONE path + ONE stroke call instead of
  // one stroke per bubble — far cheaper than N separate draw calls.
  const outlinePath = (!glowEnabled) ? new Path2D() : null;

  for (let i = 0; i < cells.length; i++) {
    const cell = cells[i];
    const cx = cell.cx, cy = cell.cy, col = cell.col, row = cell.row;

    if (displayMode === 'camera') {
      if (camReady) {
        drawCameraCell(cx, cy, col, row, radius, srcOffX, srcOffY, srcSize);
      } else {
        const phase = (col * 0.4) - t * 1.4 + row * 0.3;
        const b = Math.max(0, Math.sin(phase)) * 0.12;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${b})`;
        ctx.fill();
      }
    } else {
      let fillColor = colorA;
      let alpha = 1;
      const speedFactor = pulseSpeed / 60;
      if (colorMode === 'alternating') {
        const alt = ((col + row) % 2 + 2) % 2;
        fillColor = alt === 0 ? colorA : colorB;
      } else if (colorMode === 'wave') {
        const phase = (cx / cssW) * 6 - t * speedFactor * 1.2;
        alpha = 0.15 + 0.85 * Math.max(0, Math.sin(phase));
      } else if (colorMode === 'ripple') {
        const dx = (cx / cssW) - 0.5, dy = (cy / cssH) - 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const phase = dist * 16 - t * speedFactor * 2.4;
        alpha = Math.max(0, 0.15 + 0.85 * Math.max(0, Math.sin(phase)) * (1 - dist * 0.7));
      } else if (colorMode === 'pulse') {
        const hue = Math.floor(hash2(col, row) * 360);
        fillColor = `hsl(${hue}, 85%, 58%)`;
        const phase = hash2(col + 41, row + 7) * Math.PI * 2;
        const speedMul = 0.5 + hash2(col + 91, row + 17) * 1.2;
        alpha = 0.25 + 0.75 * Math.max(0, Math.sin(t * speedFactor * speedMul + phase));
      }
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = fillColor;
      ctx.globalAlpha = alpha;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (outlinePath) {
      outlinePath.moveTo(cx + radius * 1.01, cy);
      outlinePath.arc(cx, cy, radius * 1.01, 0, Math.PI * 2);
    }
  }

  if (outlinePath) {
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke(outlinePath);
  }

  if (glowEnabled) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sprites = getGlowSprites(radius);
    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      let sprite;
      if (glowMode === 'rainbow') {
        const hue = Math.floor(hash2(cell.col, cell.row) * 360);
        const idx = Math.min(GLOW_HUE_BUCKETS - 1, Math.floor((hue / 360) * GLOW_HUE_BUCKETS));
        sprite = sprites.rainbow[idx];
      } else {
        sprite = sprites.single;
      }
      ctx.drawImage(sprite.canvas, cell.cx - sprite.size / 2, cell.cy - sprite.size / 2);
    }
    ctx.restore();
  }

  if (overlayOn) {
    const sheen = ctx.createLinearGradient(0, 0, cssW, cssH);
    sheen.addColorStop(0, 'rgba(255,255,255,0.05)');
    sheen.addColorStop(0.5, 'rgba(255,255,255,0.00)');
    sheen.addColorStop(1, 'rgba(255,255,255,0.04)');
    ctx.fillStyle = sheen;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  ctx.restore();
}

function loop(now) {
  const frameInterval = maxFps > 0 ? 1000 / maxFps : 0;
  if (frameInterval > 0 && now - lastFrameTime < frameInterval) {
    requestAnimationFrame(loop);
    return;
  }
  const dt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;
  t += dt;
  render();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
reportStatus();
</script>
</body>
</html>
